<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
      }
      /* The favicon: ":)" in Cedarville Cursive, bright green on the deep green. */
      #icon {
        width: 512px;
        height: 512px;
        display: grid;
        place-items: center;
        background: #088139;
        color: #00ff5f;
        font-family: "Cedarville Cursive", cursive;
        font-size: 400px;
        line-height: 1;
      }
      #icon span {
        display: block;
        transform: translate(-10px, 46px);
      }
    </style>
  </head>
  <body>
    <div id="icon"><span>:)</span></div>
  </body>
</html>
